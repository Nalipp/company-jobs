  <style>
    :root {
      --white: #ffffff;
      --ink: #171717;
      --mist: #e8e8e8;
      --blue: #1e90ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 8px;
      background: var(--white);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.05;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      height: 27px;
      overflow: hidden;
      white-space: nowrap;
    }
    h1 { margin: 0; font-size: 16px; }
    #summary { font-size: 12px; }
    .table-wrap {
      height: calc(100vh - 43px);
      overflow: auto;
      border: 1px solid var(--mist);
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    thead { position: sticky; top: 0; z-index: 1; }
    th {
      height: 24px;
      padding: 0;
      background: var(--ink);
      color: var(--white);
      text-align: left;
    }
    th button {
      width: 100%;
      height: 24px;
      border: 0;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--white);
      font: inherit;
      font-weight: 700;
      line-height: 1;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    th button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    td {
      height: 22px;
      padding: 3px 6px;
      border-top: 1px solid var(--mist);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }
    tbody tr:nth-child(even) { background: var(--mist); }
    tbody tr:hover { background: var(--mist); }
    a { color: var(--blue); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .company { width: 15%; }
    .title { width: 29%; }
    .location { width: 20%; }
    .workplace { width: 10%; }
    .employment { width: 10%; }
    .published { width: 9%; }
    .open { width: 7%; }
  </style>
</head>
