<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Job details from V4 Daily Jobs.">
    <title>Job — V4 Daily Jobs</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="job">
    <header class="site-header">
      <a class="brand" id="company-back" href="index.html">← Company</a>
      <span class="header-context">Job detail</span>
    </header>
    <main id="job-page" class="shell detail-shell job-shell" hidden>
      <section class="job-heading">
        <p class="eyebrow">Matched role</p>
        <h1 id="job-title"></h1>
        <a class="company-link" id="job-company" href="#"></a>
        <div class="tag-row" id="job-tags"></div>
      </section>

      <section class="summary-card">
        <div class="summary-topline"><h2>Why it matched</h2><span class="tag tag-blue">Active</span></div>
        <div id="match-summary" class="match-summary"></div>
        <div class="action-row" id="job-actions"></div>
      </section>

      <section class="data-card" id="job-facts-card">
        <div class="section-heading card-heading"><h2>Role details</h2><span>Official posting</span></div>
        <dl class="fact-grid job-fact-grid" id="job-facts"></dl>
      </section>

      <section class="data-card" id="evidence-card" hidden>
        <div class="section-heading card-heading"><h2>Match notes</h2><span>Research review</span></div>
        <div class="evidence-list" id="evidence-list"></div>
      </section>

      <section class="data-card description-card" id="description-card" hidden>
        <div class="section-heading card-heading"><h2>Job description</h2><span>From the posting</span></div>
        <div class="job-description" id="job-description"></div>
      </section>

      <p class="freshness-note" id="job-freshness"></p>
    </main>
    <main id="not-found" class="shell error-state" hidden></main>
    <footer><span>V4 Daily Jobs</span><a href="index.html">All companies</a></footer>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
