<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Company details and matched jobs from V4 Daily Jobs.">
    <title>Company — V4 Daily Jobs</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="company">
    <header class="site-header">
      <a class="brand" href="index.html">← All companies</a>
      <span class="header-context">Company detail</span>
    </header>
    <main id="company-page" class="shell detail-shell" hidden>
      <section class="page-heading">
        <div>
          <p class="eyebrow">Matched company</p>
          <h1 id="company-name"></h1>
          <p class="subhead" id="company-location"></p>
        </div>
        <span class="count-mark"><strong id="company-job-count"></strong><small id="company-job-label"></small></span>
      </section>

      <section class="summary-card">
        <div class="summary-topline"><h2>Company overview</h2><span class="tag tag-blue">Active matches</span></div>
        <p id="company-summary"></p>
        <div class="action-row" id="company-actions"></div>
      </section>

      <section class="data-card" id="company-facts-card">
        <div class="section-heading card-heading"><h2>Company details</h2><span>Verified research</span></div>
        <dl class="fact-grid" id="company-facts"></dl>
      </section>

      <section class="list-section" aria-labelledby="jobs-title">
        <div class="section-heading">
          <h2 id="jobs-title">Matched jobs</h2>
          <span id="jobs-status"></span>
        </div>
        <div id="result-list" class="result-list"></div>
      </section>

      <details id="source-details">
        <summary>Job source details <span id="source-count"></span></summary>
        <div class="details-body" id="source-list"></div>
      </details>
    </main>
    <main id="not-found" class="shell error-state" hidden></main>
    <footer><span>V4 Daily Jobs</span><a href="index.html">All companies</a></footer>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
